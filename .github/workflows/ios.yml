name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project GIFStudio.xcodeproj -scheme GIFStudio \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GIFStudio.app Payload/
          zip -qr GIFStudio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GIFStudio-unsigned
          path: GIFStudio-unsigned.ipa
          
